<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ECLYPS | Beyond The Void</title>

    
    <link rel="stylesheet" href="/css/connection.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <div class="background"></div>

    <header>

        <nav class="navbar">

            <a href="#" class="logo">

                <img src="/public/icon.png" alt="Logo ECLYPS">


            </a>

            <ul>

                <li><a href="#">Início</a></li>

                <li><a href="#">Animes</a></li>

                <li><a href="#">Filmes</a></li>

                <li><a href="#">Lançamentos</a></li>

                <li><a href="#">Minha Lista</a></li>

            </ul>

            <div class="nav-icons">

                <button>

                    <i class="fa-solid fa-magnifying-glass"></i>

                </button>

                <button>

                    <i class="fa-solid fa-user"></i>

                </button>

            </div>

        </nav>

    </header>

    <main>

        <section class="hero">

            <div class="hero-left">

                <span class="tag">

                    🔥 EM ALTA

                </span>

                <h1>

                    SOLO<br>
                    LEVELING

                </h1>

                <p>

                    A fraqueza de hoje é a força de amanhã.
                    Depois de despertar em um mundo de masmorras,
                    Sung Jin-Woo inicia sua jornada para se tornar
                    o caçador mais poderoso.

                </p>

                <div class="buttons">

                    <button class="watch">

                        <i class="fa-solid fa-play"></i>

                        Assistir Agora

                    </button>

                    <button class="list">

                        <i class="fa-solid fa-plus"></i>

                        Minha Lista

                    </button>

                </div>

                <div class="dots">

                    <span class="active"></span>

                    <span></span>

                    <span></span>

                    <span></span>

                </div>

            </div>

            <div class="hero-right">

                <div class="slider">

                    <div class="anime active">

                        <img src="img/solo.jpg">

                    </div>

                    <div class="anime">

                        <img src="img/jujutsu.jpg">

                    </div>

                    <div class="anime">

                        <img src="img/demon.jpg">

                    </div>

                    <div class="anime">

                        <img src="img/aot.jpg">

                    </div>

                    <div class="anime">

                        <img src="img/bleach.jpg">

                    </div>

                </div>

            </div>

        </section>

    </main>

<script src="js/app.js"></script>
<script src="js/slider.js"></script>

</body>

</html>
